name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1                   # Set this to your preferred AWS region
  ECR_REPOSITORY: truth-checker-backend   # Same as in Terraform
  CONTAINER_NAME: truth-checker-api

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and push it to ECR
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Deploy to EC2 Instance
      env:
        PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        HOST: ${{ secrets.EC2_HOST }}
        USER: ubuntu
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        # Save private key to a file
        echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
        
        # SSH into EC2 instance, authenticate docker with ECR, pull the image, and run it
        ssh -o StrictHostKeyChecking=no -i private_key ${USER}@${HOST} "
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin $ECR_REGISTRY &&
          sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest &&
          sudo docker stop ${{ env.CONTAINER_NAME }} || true &&
          sudo docker rm ${{ env.CONTAINER_NAME }} || true &&
          sudo docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p 8000:8000 \
            -e GOOGLE_API_KEY=\"$GOOGLE_API_KEY\" \
            --restart unless-stopped \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
        "
